name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una corrida por rama y workflow: un push nuevo cancela el anterior en vez de
# competir por el mismo runner. Sin esto, `e2e` (155-244 s) moría a los ~91 s con
# `##[error]The operation was canceled.` cada vez que un push llegaba a <180 s
# de la corrida anterior — 33 de 99 corridas lo hacían. El grupo incluye
# `github.ref`, así que un PR y `main` no se cancelan entre sí.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run typecheck`, no `npx tsc --noEmit`: CI y local deben invocar el
      # mismo comando (invariante 11). Si el script cambia, cambia en los dos.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `Build` va ANTES de `Knip` a propósito. Con `Knip` delante, toda corrida
      # que knip rompía dejaba `Build` sin ejecutar (conclusión `-`): el gate más
      # caro era el único que nunca daba señal. `Knip` sigue bloqueando, solo
      # deja de esconder lo que viene después.
      - name: Build
        run: npm run build

      - name: Knip (dead code audit)
        run: npm run knip

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
