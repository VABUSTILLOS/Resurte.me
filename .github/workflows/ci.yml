name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una corrida por rama y workflow, para que dos pushes no compitan por el mismo
# runner.
#
# `cancel-in-progress` se limita a los PRs. En `main` NO se cancela, y la razón
# es medida: este repo autocommitea ("Save uncommitted changes") cada pocos
# minutos, así que con la cancelación activa el job `e2e` no llegaba nunca al
# primer test — moría calentando rutas, con `##[error]The operation was
# canceled.` (p. ej. `[e2e] calentando 64/84`), y el resultado era un job rojo
# permanente que no medía nada. Al no cancelar, cada corrida de `main` termina y
# su rojo (o su verde) significa algo. En un PR el push nuevo reemplaza al viejo
# y nadie pierde señal, así que ahí sí se cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run typecheck`, no `npx tsc --noEmit`: CI y local deben invocar el
      # mismo comando (invariante 11). Si el script cambia, cambia en los dos.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `Build` va ANTES de `Knip` a propósito. Con `Knip` delante, toda corrida
      # que knip rompía dejaba `Build` sin ejecutar (conclusión `-`): el gate más
      # caro era el único que nunca daba señal. `Knip` sigue bloqueando, solo
      # deja de esconder lo que viene después.
      - name: Build
        run: npm run build

      - name: Knip (dead code audit)
        run: npm run knip

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
